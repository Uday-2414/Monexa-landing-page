<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radiant Teal/Cyan gradient matching the glowing premium look -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#007a99" />
    </linearGradient>
  </defs>
  
  <!-- Stylized Geometric White 'C' -->
  <path d="M 125,50 A 55,55 0 1,0 125,150" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  
  <!-- Stylized Teal '<' forming the 'K' monogram, pointing left into the 'C' -->
  <path d="M 175,50 L 125,100 L 175,150" fill="none" stroke="url(#tealGradient)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
</svg>
